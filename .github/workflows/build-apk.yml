name: Build MyWorkout APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          ls -lh
          test -f MyWorkout-Android-APKBuild-v2.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q MyWorkout-Android-APKBuild-v2.zip -d extracted
          find extracted -maxdepth 3 -type f | sort | head -100

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: extracted/MyWorkout
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyWorkout-APK
          path: extracted/MyWorkout/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
